<title>Math Contest Trainer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Gabarito:wght@500;700;800&display=swap">
<style>
/* Layout: a squared-paper exercise book. One problem per sheet, a red margin rule down the left, a single left-aligned column. */
:root{
  --paper:#F3F6FA; --grid:#DCE5F0; --sheet:#FFFFFF; --ink:#18244A; --muted:#566283;
  --margin:#D9483B; --hl:#FFDD55; --on-hl:#18244A; --good:#12764F; --good-bg:#DDF3E8; --bad:#B93426; --bad-bg:#FBE4E0; --line:#C3CFE0; --shade:#B9C6DA;
  --display:"Gabarito","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#12241F; --grid:#1B332C; --sheet:#182E28; --ink:#EDF3EC; --muted:#A3B8AD;
  --margin:#EE8176; --hl:#F2CE4A; --on-hl:#12241F; --good:#74D6A8; --good-bg:#1D4234; --bad:#F39C92; --bad-bg:#47251F; --line:#35524A; --shade:#5E7A70;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#12241F; --grid:#1B332C; --sheet:#182E28; --ink:#EDF3EC; --muted:#A3B8AD;
  --margin:#EE8176; --hl:#F2CE4A; --on-hl:#12241F; --good:#74D6A8; --good-bg:#1D4234; --bad:#F39C92; --bad-bg:#47251F; --line:#35524A; --shade:#5E7A70;
  color-scheme:dark }

*{box-sizing:border-box}
body{background-color:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;padding-inline:16px;padding-block:20px 48px}
.book{max-width:44rem;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px}
h1{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1.1;margin:0;letter-spacing:-0.01em}
h2{font-family:var(--display);font-weight:700;font-size:1.35rem;line-height:1.2;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:1.05rem;margin:0}
p{margin:0}
nav{display:flex;gap:4px}
nav a{font-family:var(--display);font-weight:700;color:var(--ink);text-decoration:none;padding:6px 12px;border-bottom:3px solid transparent}
nav a[aria-current="page"]{border-bottom-color:var(--margin)}
:focus-visible{outline:3px solid var(--margin);outline-offset:2px}

.sheet{position:relative;background:var(--sheet);border:1px solid var(--line);padding:24px 24px 24px 52px;display:flex;flex-direction:column;gap:18px;min-width:0}
.sheet::before{content:"";position:absolute;left:32px;top:0;bottom:0;width:1px;background:var(--margin)}
@media (max-width:480px){ .sheet{padding:18px 16px 18px 30px} .sheet::before{left:16px} }
.notice{background:var(--hl);color:var(--on-hl);padding:10px 14px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;color:var(--muted);font-size:.9rem}
.skill{font-family:var(--display);font-weight:700;color:var(--ink);font-size:1rem}
.lv{display:inline-flex;gap:3px;vertical-align:middle}
.lv i{width:11px;height:11px;border:1.5px solid var(--ink);display:block}
.lv i.on{background:var(--ink)}
.question{font-size:1.2rem;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
.btn{font-family:var(--display);font-weight:700;background:var(--sheet);border:2px solid var(--ink);padding:10px 18px;min-height:46px}
.btn.primary{background:var(--ink);color:var(--sheet)}
.btn.quiet{border-color:var(--line);font-weight:500}
.btn:disabled{opacity:.45}
.btn[aria-pressed="true"]{background:var(--hl);color:var(--on-hl);border-color:var(--on-hl)}
.choice{display:flex;gap:14px;align-items:baseline;text-align:left;width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 8px;min-height:48px;font-size:1.1rem}
.choice b{font-family:var(--display);font-weight:800;flex:none;width:1.4em}
.choice span{min-width:0;overflow-wrap:anywhere}
.choice.pic{align-items:center}
.choice[aria-pressed="true"]{background:var(--hl);color:var(--on-hl)}
.choice.right{background:var(--good-bg);color:var(--ink);box-shadow:inset 4px 0 0 var(--good)}
.choice.wrong{background:var(--bad-bg);color:var(--ink);box-shadow:inset 4px 0 0 var(--bad)}
.choice.wrong span{text-decoration:line-through}
.choice em{font-style:normal;font-weight:700;margin-left:auto;padding-left:10px;font-size:.9rem;flex:none}
.right em{color:var(--good)} .wrong em{color:var(--bad)}
.hint{border-left:4px solid var(--hl);padding:4px 0 4px 12px;white-space:pre-wrap}
.verdict{font-family:var(--display);font-weight:800;font-size:1.3rem}
.verdict.good{color:var(--good)} .verdict.bad{color:var(--bad)}
.solution{white-space:pre-wrap;border-top:1px dashed var(--line);padding-top:12px}
hr{border:0;border-top:1px dashed var(--line);margin:0;width:100%}

input[type=text]{font:inherit;color:var(--ink);background:var(--sheet);border:0;border-bottom:2px solid var(--ink);padding:10px 4px;min-height:46px;flex:1 1 12rem;min-width:0;border-radius:0}
.figure{max-width:100%;overflow-x:auto}
.figure svg{display:block;max-width:100%;height:auto;font-family:var(--body)}
.figure table{border-collapse:collapse;font-variant-numeric:tabular-nums}
.figure th,.figure td{border:1px solid var(--ink);padding:6px 12px;text-align:left}
.figure th{font-family:var(--display)}
.field{display:flex;flex-direction:column;gap:4px}
.field input[type=text]{flex:none;width:100%}
label,legend{font-weight:700}
textarea,select{font:inherit;color:var(--ink);background:var(--sheet);border:2px solid var(--ink);padding:10px;border-radius:0;width:100%;max-width:100%}
textarea{resize:vertical}
fieldset{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px 22px}
legend{padding:0;margin-bottom:4px}
.check{font-weight:400;display:inline-flex;align-items:center;gap:8px;min-height:40px}
.check input{width:20px;height:20px;accent-color:var(--ink)}
.err{color:var(--bad);font-weight:700}
.added{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.added>div{min-width:0;flex:1 1 14rem;overflow-wrap:anywhere}
.log{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--hl);color:var(--on-hl)}
.msg.assistant{align-self:flex-start;border:1px solid var(--line)}
.msg.err{color:var(--bad);border:1px solid var(--bad)}
.say{background:none;border:0;padding:0;margin-top:6px;display:block;text-decoration:underline;font-size:.85rem;color:var(--muted)}

.dots{display:inline-flex;gap:5px;margin-right:8px;vertical-align:middle}
.dots i{width:9px;height:9px;background:var(--ink);display:block;animation:hop 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s} .dots i:nth-child(3){animation-delay:.3s}
@keyframes hop{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:1}}
@media (prefers-reduced-motion:reduce){ .dots i{animation:none;opacity:.6} }

.prog-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 16px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.prog-row .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;min-width:5.5em;text-align:right}
</style>

<div class="book">
  <header class="top">
    <h1>Math Contest Trainer</h1>
    <nav aria-label="Sections">
      <a href="#practice" id="tab-practice">Practice</a>
      <a href="#progress" id="tab-progress">Progress</a>
      <a href="#parents" id="tab-parents">Parents</a>
    </nav>
  </header>
  <p id="notice" class="notice" hidden></p>
  <main id="view" class="stack"></main>
</div>

<script>
const MAP = __SKILLMAP__;
const SK = Object.fromEntries(MAP.skills.map(s => [s.id, s]));
const TOPICS = MAP.topics.concat([{ id: 'custom', name: 'Added topics' }]);
const TOPIC = Object.fromEntries(TOPICS.map(t => [t.id, t.name]));
const MAX_ADDED = 20;
const CONTESTS = { kangaroo: 'Math Kangaroo', imc: 'International Math Contest', both: 'Both contests' };
const REASONS = [
  ['read', "I didn't understand the question"],
  ['start', "I didn't know how to start"],
  ['slip', 'I knew the method but made a mistake'],
  ['guess', 'I guessed'],
];
const REASON_TEXT = Object.fromEntries(REASONS);
const THEMES = ['a swim meet', 'a school bake sale', 'a space station', 'a soccer tournament', 'a pet shelter', 'a train journey', 'a video game shop', 'a garden', 'a library', 'a pizza party', 'a robot workshop', 'a camping trip', 'a board game', 'a science fair'];
const LETTERS = 'ABCDE';
const LS = 'mct-state-v1';

const $ = id => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- state ---------- */
let S = null;                       // learner state (saved)
let cur = null;                     // the problem on screen (not saved)
let placedNote = false;
const env = { ready: false, sample: null, db: null, base: null };

function newState() { return { v: 1, contest: null, placement: { queue: [], i: 0, done: false }, skills: {}, planned: null, retry: null, last: null, custom: [] }; }
function skillState(id) { return S.skills[id] || (S.skills[id] = { level: 3, up: 0, down: 0, n: 0, ok: 0, reasons: {}, recent: [] }); }
function allSkills() { return MAP.skills.concat(S.custom || []); }
function syncCustom() {              // keep the lookup table in step with the topics a parent added
  for (const k in SK) if (k.startsWith('custom.')) delete SK[k];
  for (const s of (S.custom || [])) SK[s.id] = s;
}
function contestSkills() { return allSkills().filter(s => S.contest === 'both' || s.contests.includes(S.contest)); }

function showNotice(t) { const n = $('notice'); n.textContent = t; n.hidden = !t; }

async function loadState() {
  if (env.db && env.base) {
    try {
      const snap = await env.db.collection(env.base).doc('state').get();
      if (snap.exists) return snap.data();
    } catch (e) { env.db = null; showNotice('Could not reach your saved progress. For now, progress is kept on this device only.'); }
  }
  try { const raw = localStorage.getItem(LS); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
let saveChain = Promise.resolve();
function saveState() {
  const copy = clone(S);
  try { localStorage.setItem(LS, JSON.stringify(copy)); } catch (e) {}
  if (env.db && env.base) {
    saveChain = saveChain.then(() => env.db.collection(env.base).doc('state').set(copy))
      .catch(() => showNotice('Could not save to your account just now. Progress is kept on this device.'));
  }
}
async function logAttempt(a) {
  if (!(env.db && env.base)) return null;
  try { return await env.db.collection(env.base).doc('log').collection('attempts').add(a); } catch (e) { return null; }
}

/* ---------- leveling: two clean rights go up, two wrongs go down ---------- */
function applyResult(st, r) {
  const wrong = !r.correct || r.guessed;
  const clean = r.correct && !r.guessed && r.hints === 0;
  st.n++;
  if (!wrong) st.ok++;
  if (clean) { st.up++; st.down = 0; if (st.up >= 2 && st.level < 5) { st.level++; st.up = 0; } }
  else if (wrong) { st.down++; st.up = 0; if (st.down >= 2 && st.level > 1) { st.level--; st.down = 0; } }
  else { st.up = 0; st.down = 0; }
  if (wrong && r.reason) st.reasons[r.reason] = (st.reasons[r.reason] || 0) + 1;
  return st;
}
function pickNext(excludeId) {
  const list = contestSkills().filter(s => s.id !== excludeId);
  const weights = list.map(s => {
    const st = skillState(s.id);
    let w = 1 + (st.n === 0 ? 2 : 0) + (st.n >= 2 && st.ok / st.n < 0.6 ? 2 : 0) + (st.down > 0 ? 1 : 0);
    if (s.prerequisites.some(p => S.skills[p] && S.skills[p].n > 0 && S.skills[p].level <= 1)) w *= 0.2;
    return w;
  });
  let x = Math.random() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < list.length; i++) { x -= weights[i]; if (x <= 0) return list[i].id; }
  return list[list.length - 1].id;
}

/* ---------- figures: drawn by code from data the generator supplies, so what he sees is what was checked ---------- */
const NS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs, ...kids) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
const INK = 'var(--ink)', SHADE = 'var(--shade)', SHEET = 'var(--sheet)', LINE = 'var(--line)', MUTED = 'var(--muted)';
const isNum = v => typeof v === 'number' && isFinite(v);
const isPt = a => Array.isArray(a) && a.length === 2 && a.every(v => isNum(v) && v >= 0 && v <= 20);
const str = (v, n) => String(v == null ? '' : v).slice(0, n);
const PICTURE_CHOICES = ['grid', 'shape'];

function validFigure(f, allowed) {
  if (!f || typeof f !== 'object' || !allowed.includes(f.type)) return null;
  if (f.type === 'grid') {
    const rows = f.rows;
    if (!Array.isArray(rows) || rows.length < 1 || rows.length > 10) return null;
    if (rows.some(r => typeof r !== 'string' || r.length < 1 || r.length > 10 || r.length !== rows[0].length)) return null;
    return { type: 'grid', rows };
  }
  if (f.type === 'shape') {
    if (!Array.isArray(f.shapes) || f.shapes.length < 1 || f.shapes.length > 4) return null;
    const shapes = [];
    for (const sh of f.shapes) {
      if (!sh || !Array.isArray(sh.points) || sh.points.length < 3 || sh.points.length > 12 || !sh.points.every(isPt)) return null;
      shapes.push({ points: sh.points, sides: sh.points.map((_, i) => str(Array.isArray(sh.sides) ? sh.sides[i] : '', 12)), shaded: !!sh.shaded });
    }
    const marks = Array.isArray(f.marks) ? f.marks.slice(0, 10) : [];
    if (marks.some(m => !m || !isPt(m.at))) return null;
    return { type: 'shape', shapes, marks: marks.map(m => ({ at: m.at, label: str(m.label, 3) })), show_grid: !!f.show_grid, axes: !!f.axes };
  }
  if (f.type === 'bars') {
    if (!Array.isArray(f.labels) || !Array.isArray(f.values) || f.labels.length < 2 || f.labels.length > 8 || f.values.length !== f.labels.length) return null;
    if (f.values.some(v => !isNum(v) || v < 0 || v > 1000)) return null;
    return { type: 'bars', title: str(f.title, 60), labels: f.labels.map(l => str(l, 10)), values: f.values };
  }
  if (f.type === 'table') {
    const head = f.header, rows = f.rows;
    if (!Array.isArray(head) || head.length < 1 || head.length > 6 || !Array.isArray(rows) || rows.length < 1 || rows.length > 8) return null;
    if (rows.some(r => !Array.isArray(r) || r.length !== head.length)) return null;
    return { type: 'table', header: head.map(c => str(c, 24)), rows: rows.map(r => r.map(c => str(c, 24))) };
  }
  if (f.type === 'clock') {
    if (!Number.isInteger(f.hour) || !Number.isInteger(f.minute) || f.hour < 0 || f.hour > 23 || f.minute < 0 || f.minute > 59) return null;
    return { type: 'clock', hour: f.hour, minute: f.minute };
  }
  return null;
}
function figText(f) {                // the same figure as text, for the answer check and the tutor
  if (f.type === 'grid') return 'a grid of ' + f.rows.length + ' rows by ' + f.rows[0].length + ' columns. Rows from the top, where "#" is a shaded cell, "." is an empty cell and any other character is written in that cell: ' + f.rows.join(' / ');
  if (f.type === 'bars') return 'a bar chart' + (f.title ? ' titled "' + f.title + '"' : '') + ': ' + f.labels.map((l, i) => l + ' = ' + f.values[i]).join(', ');
  if (f.type === 'table') return 'a table. ' + [f.header].concat(f.rows).map(r => r.join(' | ')).join(' / ');
  if (f.type === 'clock') return 'an analog clock showing ' + (f.hour % 12 || 12) + ':' + String(f.minute).padStart(2, '0');
  return 'a drawing on a coordinate plane with y going up, given as data: ' + JSON.stringify({ shapes: f.shapes, marks: f.marks });
}
function label(x, y, text, size, fill, anchor) {
  return sv('text', { x, y, 'font-size': size, fill: fill || INK, 'text-anchor': anchor || 'middle', 'dominant-baseline': 'central' }, text);
}
function drawGrid(f, small) {
  const R = f.rows.length, C = f.rows[0].length, u = 10;
  const svg = sv('svg', { viewBox: '-0.5 -0.5 ' + (C * u + 1) + ' ' + (R * u + 1) });
  f.rows.forEach((row, r) => [...row].forEach((ch, c) => {
    svg.append(sv('rect', { x: c * u, y: r * u, width: u, height: u, fill: ch === '#' ? SHADE : SHEET, stroke: INK, 'stroke-width': 0.6 }));
    if (ch !== '#' && ch !== '.' && ch !== ' ') svg.append(label(c * u + 5, r * u + 5.3, ch, 6));
  }));
  return [svg, Math.min(C * (small ? 18 : 34), small ? 150 : 340)];
}
function drawShape(f, small) {
  const all = f.shapes.flatMap(sh => sh.points).concat(f.marks.map(m => m.at));
  const lined = f.show_grid || f.axes;
  let x0 = Math.min(...all.map(p => p[0])), x1 = Math.max(...all.map(p => p[0])), y0 = Math.min(...all.map(p => p[1])), y1 = Math.max(...all.map(p => p[1]));
  if (f.axes) { x0 = 0; y0 = 0; }
  if (lined) { x0 = Math.floor(x0); y0 = Math.floor(y0); x1 = Math.ceil(x1); y1 = Math.ceil(y1); }
  if (x1 - x0 < 1) x1 = x0 + 1;
  if (y1 - y0 < 1) y1 = y0 + 1;
  const u = 10, pad = 14, X = x => (x - x0) * u, Y = y => (y1 - y) * u, W = (x1 - x0) * u, H = (y1 - y0) * u;
  const svg = sv('svg', { viewBox: -pad + ' ' + -pad + ' ' + (W + 2 * pad) + ' ' + (H + 2 * pad) });
  if (lined) {
    for (let x = x0; x <= x1; x++) svg.append(sv('line', { x1: X(x), y1: 0, x2: X(x), y2: H, stroke: f.axes && x === 0 ? INK : LINE, 'stroke-width': f.axes && x === 0 ? 0.8 : 0.4 }));
    for (let y = y0; y <= y1; y++) svg.append(sv('line', { x1: 0, y1: Y(y), x2: W, y2: Y(y), stroke: f.axes && y === 0 ? INK : LINE, 'stroke-width': f.axes && y === 0 ? 0.8 : 0.4 }));
  }
  if (f.axes) {
    for (let x = x0; x <= x1; x++) svg.append(label(X(x), H + 6, x, 4, MUTED));
    for (let y = y0 + 1; y <= y1; y++) svg.append(label(-5, Y(y), y, 4, MUTED));
  }
  for (const sh of f.shapes) {
    svg.append(sv('polygon', { points: sh.points.map(p => X(p[0]) + ',' + Y(p[1])).join(' '), fill: sh.shaded ? SHADE : 'none', stroke: INK, 'stroke-width': 1, 'stroke-linejoin': 'round' }));
    const cx = sh.points.reduce((a, p) => a + X(p[0]), 0) / sh.points.length, cy = sh.points.reduce((a, p) => a + Y(p[1]), 0) / sh.points.length;
    sh.points.forEach((a, i) => {
      if (!sh.sides[i]) return;
      const b = sh.points[(i + 1) % sh.points.length];
      const mx = (X(a[0]) + X(b[0])) / 2, my = (Y(a[1]) + Y(b[1])) / 2;
      let nx = -(Y(b[1]) - Y(a[1])), ny = X(b[0]) - X(a[0]);
      const len = Math.hypot(nx, ny) || 1; nx /= len; ny /= len;
      if ((mx + nx - cx) ** 2 + (my + ny - cy) ** 2 < (mx - nx - cx) ** 2 + (my - ny - cy) ** 2) { nx = -nx; ny = -ny; }   // push the label away from the middle of the shape
      svg.append(label(mx + nx * 6.5, my + ny * 5, sh.sides[i], 4.6));
    });
  }
  for (const m of f.marks) {
    svg.append(sv('circle', { cx: X(m.at[0]), cy: Y(m.at[1]), r: 1.3, fill: INK }));
    if (m.label) svg.append(label(X(m.at[0]) + 4, Y(m.at[1]) - 4, m.label, 5));
  }
  const px = Math.max(150, Math.min(380, (W + 2 * pad) * 2.6));
  return [svg, small ? px / 2.3 : px];
}
function drawBars(f, small) {
  const n = f.values.length, W = 120, H = 70, ox = 16, oy = 6, max = Math.max(1, ...f.values);
  const step = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500].find(st => max / st <= 6) || 500, top = Math.ceil(max / step) * step;

/* ---------- views ---------- */
function levelDots(n) { return h('span', { class: 'lv', role: 'img', 'aria-label': 'Level ' + n + ' of 5' }, [1, 2, 3, 4, 5].map(i => h('i', { class: i <= n ? 'on' : '' }))); }
function busyLine(t) { return h('p', null, h('span', { class: 'dots' }, h('i'), h('i'), h('i')), t); }

function viewPractice() {
  if (!env.ready) return [h('div', { class: 'sheet' }, busyLine('Loading your progress'))];
  if (!S.contest) return [h('div', { class: 'sheet' },
    h('h2', null, 'Which contest are you training for?'),
    h('p', { class: 'muted' }, 'You start with a few medium problems, one per topic. After that, every skill moves up or down on its own as you answer.'),
    h('div', { class: 'row' }, Object.keys(CONTESTS).map(k => h('button', { class: 'btn', type: 'button', onclick: () => chooseContest(k) }, CONTESTS[k]))))];
  if (!env.sample) return [h('div', { class: 'sheet' }, h('h2', null, 'Open this page in Claude to practise'), h('p', { class: 'muted' }, 'Problems and tutor replies are written by Claude, which is not available in this view.'))];
  if (!cur) {
    const pl = S.placement, fresh = !pl.done && pl.i === 0;
    return [h('div', { class: 'sheet' },
      h('h2', null, fresh ? 'First, ' + pl.queue.length + ' problems to find your level' : pl.done ? 'Ready for more?' : 'Finish finding your level'),
      h('p', { class: 'muted' }, fresh ? 'One medium problem from each topic. No timer. Each problem is written fresh and its answer is checked twice before you see it, so the first one can take up to a minute.' : pl.done ? 'Pick up where you left off. ' + CONTESTS[S.contest] + '.' : (pl.queue.length - pl.i) + ' placement problems left.'),
      h('div', { class: 'row' }, h('button', { class: 'btn primary', type: 'button', onclick: loadProblem }, fresh ? 'Start' : 'Continue')))];
  }
  const t = cur.target, sk = SK[t.skill];
  const meta = h('div', { class: 'meta' },
    h('span', { class: 'skill' }, sk.name), levelDots(t.level),
    h('span', null, t.mode === 'placement' ? 'Placement ' + (S.placement.i + 1) + ' of ' + S.placement.queue.length
      : 'Level ' + t.level + (sk.contests.includes('kangaroo') ? ', about a ' + (t.level <= 2 ? 3 : t.level <= 4 ? 4 : 5) + '-point Kangaroo question' : '')),
    t.mode === 'retry' ? h('span', null, 'A similar one to try again') : null);
  if (cur.loading) return [h('div', { class: 'sheet' }, meta,
    h('p', null, h('span', { class: 'dots' }, h('i'), h('i'), h('i')), h('span', { id: 'wait-line' }, waitText())),
    h('p', { class: 'muted small' }, 'Each problem is written, then solved a second time to check the answer. That usually takes under a minute, and longer for problems with figures.'),
    h('div', { class: 'row', id: 'wait-again', hidden: Date.now() - cur.since < 45000 },
      h('span', null, 'Taking a while?'), h('button', { class: 'btn quiet', type: 'button', onclick: loadProblem }, 'Start this one again')))];
  if (cur.error) return [h('div', { class: 'sheet' }, meta, h('p', null, cur.error),
    cur.swapped ? h('p', null, 'The next try uses a different skill from the same topic.') : null,
    cur.why && cur.why.length ? h('p', { class: 'muted small' }, 'For a grown-up: ' + cur.why.map((w, i) => 'draft ' + (i + 1) + ', ' + w).join('; ') + '.') : null,
    h('div', { class: 'row' }, h('button', { class: 'btn primary', type: 'button', onclick: loadProblem }, 'Try again')))];

  const c = cur, p = c.p, st = skillState(t.skill);
  const showRight = c.checked && (c.correct || c.revealed);
  const choices = h('div', { role: 'group', 'aria-label': 'Answer choices' }, p.choices.map((txt, i) => {
    const right = showRight && i === p.answer, wrong = c.checked && !c.correct && i === c.picked;
    return h('button', { class: 'choice' + (p.choice_figures ? ' pic' : '') + (right ? ' right' : wrong ? ' wrong' : ''), type: 'button', disabled: c.checked, 'aria-pressed': !c.checked && c.picked === i ? 'true' : 'false', onclick: () => { c.picked = i; render(); } },
      h('b', null, LETTERS[i]), h('span', null, p.choice_figures ? figureEl(p.choice_figures[i], true) : txt), right ? h('em', null, 'Correct') : wrong ? h('em', null, 'Your answer') : null);
  }));
  const out = [meta];
  if (placedNote && t.mode !== 'placement') out.push(h('p', { class: 'notice' }, 'Placement done. From here each skill adjusts on its own.'));
  out.push(h('div', null, h('p', { class: 'question' }, p.question), canSpeak ? h('button', { class: 'say', type: 'button', onclick: () => speak(p.question + '. ' + p.choices.map((x, i) => LETTERS[i] + ': ' + x).join('. ')) }, 'Read this aloud') : null));
  if (p.figure) out.push(figureEl(p.figure));
  out.push(choices);
  for (let i = 0; i < c.hints; i++) out.push(h('p', { class: 'hint' }, 'Hint ' + (i + 1) + ': ' + p.hints[i]));
  if (!c.checked) {
    out.push(h('div', { class: 'row' },
      h('button', { class: 'btn primary', type: 'button', disabled: c.picked == null, onclick: check }, 'Check answer'),
      c.hints < p.hints.length ? h('button', { class: 'btn quiet', type: 'button', onclick: () => { c.hints++; render(); } }, c.hints ? 'Another hint' : 'Show a hint') : null));
  } else {
    const moved = st.level - c.before.level;
    out.push(h('hr'));
    out.push(h('p', { class: 'verdict ' + (c.correct ? 'good' : 'bad') }, c.correct ? 'Correct' : 'Not this one'));
    if (moved && t.mode !== 'placement') out.push(h('p', null, moved > 0 ? 'Two in a row. This skill moves up to level ' + st.level + '.' : 'This skill drops to level ' + st.level + ' for now, to rebuild it.'));
    if (c.correct) {
      out.push(h('div', { class: 'row' },
        h('button', { class: 'btn quiet', type: 'button', 'aria-pressed': c.reason === 'guess' ? 'true' : 'false', onclick: () => setFeedback({ reason: c.reason === 'guess' ? null : 'guess' }) }, 'I guessed this one'),
        !c.revealed ? h('button', { class: 'btn quiet', type: 'button', onclick: () => { c.revealed = true; render(); } }, 'Show the solution') : null));
    } else {
      out.push(h('div', { class: 'stack' }, h('h3', null, 'What happened?'),
        h('div', { class: 'row' }, REASONS.map(([k, label]) => h('button', { class: 'btn quiet', type: 'button', 'aria-pressed': c.reason === k ? 'true' : 'false', onclick: () => setFeedback({ reason: k }) }, label))),
        h('div', { class: 'row' }, h('input', { type: 'text', id: 'note', value: c.note, placeholder: 'Anything else? (optional)', 'aria-label': 'What was hard about it', onchange: ev => setFeedback({ note: ev.target.value.slice(0, 300) }) }))));
      out.push(h('div', { class: 'row' },
        h('button', { class: 'btn', type: 'button', disabled: c.busy, onclick: () => { c.chatOpen = true; render(); tutorSend('I picked ' + LETTERS[c.picked] + ' and it was wrong.' + (c.reason ? ' ' + REASON_TEXT[c.reason] + '.' : '') + ' Help me work it out, one step at a time.', true); } }, 'Work through it with the tutor'),
        !c.revealed ? h('button', { class: 'btn quiet', type: 'button', onclick: () => { c.revealed = true; render(); } }, 'Show the solution') : null));
    }
    if (c.revealed) out.push(h('p', { class: 'solution' }, p.solution));
    const wrongNow = !c.correct || c.reason === 'guess';
    out.push(h('div', { class: 'row' }, h('button', { class: 'btn primary', type: 'button', onclick: advance }, t.mode === 'practice' && wrongNow ? 'Try a similar one' : 'Next problem')));
  }
  out.push(chatBlock(c));
  return [h('div', { class: 'sheet' }, out)];
}

let confirmReset = false;
function viewProgress() {
  if (!env.ready) return [h('div', { class: 'sheet' }, busyLine('Loading your progress'))];
  const list = S.contest ? contestSkills() : [];
  const all = list.map(s => S.skills[s.id]).filter(Boolean);
  const n = all.reduce((a, s) => a + s.n, 0), ok = all.reduce((a, s) => a + s.ok, 0);
  if (!n) return [h('div', { class: 'sheet' }, h('h2', null, 'Nothing to show yet'), h('p', { class: 'muted' }, 'Answer a few problems and each skill appears here with its level and how many you got right.'), h('div', { class: 'row' }, h('a', { class: 'btn primary', href: '#practice', style: 'text-decoration:none;display:inline-flex;align-items:center' }, 'Go to practice')))];
  const reasons = {};
  for (const s of all) for (const k in s.reasons) reasons[k] = (reasons[k] || 0) + s.reasons[k];
  const top = Object.entries(reasons).sort((a, b) => b[1] - a[1])[0];
  const head = h('div', { class: 'sheet' },
    h('h2', null, n + (n === 1 ? ' problem' : ' problems') + ' answered, ' + Math.round(100 * ok / n) + '% correct'),
    h('p', { class: 'muted' }, CONTESTS[S.contest] + (S.placement.done ? '' : ', placement in progress') + '. Guesses count as not correct.'),
    top ? h('p', null, 'Most common trouble: ' + REASON_TEXT[top[0]].replace(/^I /, 'he ').replace(/^he didn't/, "didn't").replace(/^he knew/, 'knew').replace(/^he guessed/, 'guessed') + ' (' + top[1] + (top[1] === 1 ? ' time' : ' times') + ').') : null);
  const groups = TOPICS.filter(tp => list.some(s => s.topic === tp.id)).map(tp => h('div', { class: 'sheet' },
    h('h3', null, tp.name),
    h('div', null, list.filter(s => s.topic === tp.id).map(s => {
      const st = S.skills[s.id];
      return h('div', { class: 'prog-row' }, h('span', null, s.name), st && st.n ? levelDots(st.level) : h('span', { class: 'muted small' }, 'not tried'), h('span', { class: 'n' }, st && st.n ? st.ok + ' of ' + st.n + ' right' : ''));
    }))));
  const reset = h('div', { class: 'row' }, confirmReset
    ? [h('span', null, 'Erase all progress? Topics you added stay.'), h('button', { class: 'btn', type: 'button', onclick: () => { confirmReset = false; const kept = S.custom || []; S = newState(); S.custom = kept; syncCustom(); cur = null; pre.clear(); saveState(); location.hash = '#practice'; render(); } }, 'Erase progress'), h('button', { class: 'btn quiet', type: 'button', onclick: () => { confirmReset = false; render(); } }, 'Keep it')]
    : h('button', { class: 'btn quiet', type: 'button', onclick: () => { confirmReset = true; render(); } }, 'Start over'));
  return [head, ...groups, reset];
}

/* ---------- parents: add topics beyond the built-in skill map ---------- */
let removing = null;
function addTopic(ev) {
  ev.preventDefault();
  const name = $('pt-name').value.trim().slice(0, 60), note = $('pt-note').value.trim().slice(0, 400), group = $('pt-group').value;
  const contests = ['kangaroo', 'imc'].filter(c => $('pt-' + c).checked);
  const err = !name ? 'Give the topic a name.'
    : !contests.length ? 'Tick at least one contest.'
    : allSkills().some(s => s.name.toLowerCase() === name.toLowerCase()) ? 'There is already a topic called "' + name + '".'
    : (S.custom || []).length >= MAX_ADDED ? 'You can add up to ' + MAX_ADDED + ' topics. Remove one first.' : '';
  if (err) { const e = $('pt-error'); e.textContent = err; e.hidden = false; return; }
  S.custom = (S.custom || []).concat({ id: 'custom.' + Date.now().toString(36), name, topic: TOPIC[group] ? group : 'custom', contests, prerequisites: [], note });
  syncCustom(); saveState(); render();
}
function removeTopic(id) {
  S.custom = (S.custom || []).filter(s => s.id !== id);
  delete S.skills[id];
  const q = S.placement.queue, at = q.indexOf(id);
  if (at >= 0) { q.splice(at, 1); if (at < S.placement.i) S.placement.i--; if (S.contest && S.placement.i >= q.length) S.placement.done = true; }
  for (const k of ['planned', 'retry', 'last']) if (S[k] === id) S[k] = null;
  if (cur && cur.target && cur.target.skill === id) { if (cur.ctl) cur.ctl.abort(); cur = null; }
  removing = null;
  syncCustom(); saveState(); render();
}
function viewParents() {
  if (!env.ready) return [h('div', { class: 'sheet' }, busyLine('Loading your progress'))];
  const mine = S.custom || [];
  const form = h('form', { class: 'sheet', onsubmit: addTopic },
    h('h2', null, 'Add a topic'),
    h('p', { class: 'muted' }, 'For parents. Add anything the built-in list misses. Problems for it are written and answer-checked the same way. It starts at level 3 and moves up or down as he answers.'),
    h('div', { class: 'field' }, h('label', { for: 'pt-name' }, 'Topic name'),
      h('input', { type: 'text', id: 'pt-name', maxlength: 60, autocomplete: 'off', placeholder: 'Ratios and proportions' })),
    h('div', { class: 'field' }, h('label', { for: 'pt-note' }, 'What should the problems cover?'),
      h('textarea', { id: 'pt-note', rows: 3, maxlength: 400, placeholder: 'Sharing in a ratio, scaling a recipe, simple proportion word problems' })),
    h('div', { class: 'field' }, h('label', { for: 'pt-group' }, 'Show it under'),
      h('select', { id: 'pt-group' }, TOPICS.map(t => h('option', { value: t.id, selected: t.id === 'custom' }, t.name)))),
    h('fieldset', null, h('legend', null, 'Use it for'),
      h('label', { class: 'check' }, h('input', { type: 'checkbox', id: 'pt-kangaroo', checked: true }), CONTESTS.kangaroo),
      h('label', { class: 'check' }, h('input', { type: 'checkbox', id: 'pt-imc', checked: true }), CONTESTS.imc)),
    h('p', { class: 'err', id: 'pt-error', role: 'alert', hidden: true }),
    h('div', { class: 'row' }, h('button', { class: 'btn primary', type: 'submit' }, 'Add topic')));
  const list = h('div', { class: 'sheet' }, h('h3', null, 'Topics you added'),
    mine.length ? h('div', null, mine.map(s => {
      const st = S.skills[s.id];
      return h('div', { class: 'added' },
        h('div', null, h('strong', null, s.name),
          h('div', { class: 'muted small' }, TOPIC[s.topic] + ', ' + s.contests.map(c => CONTESTS[c]).join(' and ') + (st && st.n ? ', level ' + st.level + ', ' + st.ok + ' of ' + st.n + ' right' : ', not tried yet')),
          s.note ? h('div', { class: 'small' }, s.note) : null),
        removing === s.id
          ? h('div', { class: 'row' }, h('span', null, 'Remove it and its progress?'),
              h('button', { class: 'btn', type: 'button', onclick: () => removeTopic(s.id) }, 'Remove topic'),
              h('button', { class: 'btn quiet', type: 'button', onclick: () => { removing = null; render(); } }, 'Keep it'))
          : h('button', { class: 'btn quiet', type: 'button', onclick: () => { removing = s.id; render(); } }, 'Remove'));
    })) : h('p', { class: 'muted' }, 'None yet. A topic you add shows up here, in Progress, and in his practice within a few problems.'));
  return [form, list];
}

function render() {
  const route = location.hash === '#progress' ? 'progress' : location.hash === '#parents' ? 'parents' : 'practice';
  for (const r of ['practice', 'progress', 'parents']) { const a = $('tab-' + r); if (r === route) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); }
  $('view').replaceChildren(...(route === 'progress' ? viewProgress() : route === 'parents' ? viewParents() : viewPractice()));
  if (route === 'practice' && cur && cur.p) { if (cur.chatOpen) renderChat(); if (cur.target.mode !== 'placement' && placedNote && cur.checked) placedNote = false; }
}
window.addEventListener('hashchange', render);

async function boot() {
  S = newState();
  render();
  const use = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  const [sample, db, user] = await Promise.all([use('sample'), use('db'), use('user')]);
  env.sample = sample;
  if (db && user) { try { const id = await user.id(); if (id) { env.db = db; env.base = 'data/users/' + id; } } catch (e) {} }
  const saved = await loadState();
  if (saved && saved.v === 1) S = Object.assign(newState(), saved);
  if (!Array.isArray(S.custom)) S.custom = [];
  syncCustom();
  env.ready = true;
  render();
}
boot();
</script>
